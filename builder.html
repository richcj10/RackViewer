<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RackView Builder</title>
<style>
/* Three-pane workbench: structure tree | exact device preview (rendered by the Pi) | inspector. */
:root {
  --bg: #eef1f4; --panel: #ffffff; --panel-2: #f5f7f9; --line: #d6dce3; --fg: #17202a; --muted: #5d6b7a;
  --accent: #0b7a83; --accent-soft: #d5eff0; --danger: #b4232a; --ok: #1a7f37; --warn: #9a6700;
  --font-ui: "Segoe UI", system-ui, -apple-system, sans-serif; --font-mono: ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1418; --panel: #161d23; --panel-2: #1b242b; --line: #2b3640; --fg: #e3e9ef; --muted: #93a2b0;
    --accent: #3cc6cf; --accent-soft: #123a3e; --danger: #ff7b72; --ok: #3fb950; --warn: #d29922; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* tabs swap whole views; layout classes must not override this */
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px var(--font-ui); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top { display: flex; align-items: center; gap: 10px; padding: 9px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand b { font-size: 16px; } .brand span { color: var(--muted); font-size: 12px; margin-left: 8px; }
.navtabs { display: flex; gap: 4px; }
.navtabs button { border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; color: var(--muted); font-weight: 600; }
.navtabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.spacer { flex: 1; }
.status { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.ok { background: #3fb950; } .dot.bad { background: #f85149; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 6px 11px; border-radius: 8px; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
a.btn { color: inherit; text-decoration: none; display: inline-block; }
.livelink { display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; border-radius: 999px; font-weight: 700;
  color: var(--ok); border: 1.5px solid var(--ok); text-decoration: none; white-space: nowrap; }
.livelink:hover { background: color-mix(in srgb, var(--ok) 14%, transparent); }
.livelink i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
#maintbtn.on { background: #9666ff; border-color: #9666ff; color: #fff; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-top: 1px solid var(--line); }
.note:first-child { border-top: 0; } .note.pinned { border-left: 4px solid var(--accent); }
.note .body { flex: 1; min-width: 0; white-space: pre-wrap; } .note small { color: var(--muted); display: block; margin-top: 3px; }
.note textarea { width: 100%; min-height: 60px; }
.btn.small { padding: 3px 8px; font-size: 12px; border-radius: 6px; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; }
.dirty { color: var(--warn); font-size: 12px; font-weight: 600; }
.bench { display: grid; grid-template-columns: 300px minmax(0, 1fr) 340px; gap: 12px; padding: 12px 16px; height: calc(100% - 54px); }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.pane h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; padding: 11px 13px 7px; display: flex; gap: 8px; align-items: center; }
.pane h2 .grow { flex: 1; }
.scroll { overflow: auto; min-height: 0; flex: 1; padding: 0 8px 10px; }
@media (max-width: 1150px) { .bench { grid-template-columns: 1fr; height: auto; } .scroll { max-height: 60vh; } }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul { padding-left: 15px; margin-left: 10px; border-left: 1px dashed var(--line); }
.row { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; cursor: pointer; user-select: none; position: relative; }
.row:hover { background: var(--panel-2); }
.row.sel { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.row .ic { width: 18px; text-align: center; color: var(--muted); flex: none; }
.row .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .kind { font-size: 11px; color: var(--muted); }
.row .tag { font-size: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); }
.row.screen { font-weight: 700; } .row.off .lbl { color: var(--muted); text-decoration: line-through; }
.row.drop-before::before, .row.drop-after::after { content: ""; position: absolute; left: 4px; right: 4px; height: 2px; background: var(--accent); }
.row.drop-before::before { top: -1px; } .row.drop-after::after { bottom: -1px; }
.row.drop-inside { box-shadow: inset 0 0 0 2px var(--accent); }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.addbar { display: flex; gap: 6px; padding: 5px 8px; flex-wrap: wrap; }
.palette { border-top: 1px solid var(--line); padding: 8px; max-height: 44%; overflow: auto; }
.palette h3 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 8px 4px 6px; }
.pal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pal { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 6px 8px; text-align: left; display: flex; gap: 7px; }
.pal:hover { border-color: var(--accent); }
.pal b { display: block; font-size: 12.5px; } .pal small { display: block; color: var(--muted); font-size: 11px; line-height: 1.25; }
.pal .ic { width: 16px; color: var(--accent); }
.stage { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 0 14px 14px; min-height: 0; }
.crumbs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; min-height: 24px; }
.crumbs button { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 2px 4px; }
.crumbs select { font-size: 12px; padding: 2px 4px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); }
.frame-wrap { flex: 1; display: flex; justify-content: center; align-items: flex-start; min-height: 0; }
.frame { position: relative; width: 800px; height: 480px; transform-origin: top left; box-shadow: 0 0 0 10px #1b1f24, 0 12px 30px rgba(0,0,0,.35); border-radius: 4px; background: #0d1117; }
.frame img { display: block; width: 800px; height: 480px; }
.frame .hot { position: absolute; border: 1px solid transparent; cursor: pointer; }
.frame .hot:hover { border-color: rgba(88,166,255,.7); }
.frame .hot.sel { border: 2px solid #3cc6cf; box-shadow: 0 0 0 9999px rgba(0,0,0,0); }
.frame .msg { position: absolute; inset: 0; display: grid; place-items: center; color: #8b949e; font-size: 15px; text-align: center; padding: 30px; }
.frame-box { position: relative; }
.legend { color: var(--muted); font-size: 12px; }
.insp { padding: 0 13px 13px; display: flex; flex-direction: column; gap: 11px; }
.what { display: flex; gap: 10px; align-items: center; }
.what .ic { width: 32px; height: 32px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 16px; flex: none; }
.what b { display: block; font-size: 15px; } .what small { color: var(--muted); font-size: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > label, .flabel { font-size: 12px; font-weight: 600; color: var(--muted); }
.hint { font-size: 11.5px; color: var(--muted); }
.field input[type=text], .field input[type=number], .field select, .field textarea, .mini { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 6px 8px; width: 100%; }
.field textarea { font-family: var(--font-mono); font-size: 12px; min-height: 58px; }
.mono { font-family: var(--font-mono); font-size: 12px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--panel-2); padding: 5px 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.picker { position: relative; }
.menu { position: absolute; z-index: 30; top: 100%; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; max-height: 260px; overflow: auto; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.menu div { padding: 5px 9px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.menu div:hover { background: var(--accent-soft); }
.menu small { color: var(--muted); } .menu .eid { font-family: var(--font-mono); font-size: 11.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px 2px 7px; font-family: var(--font-mono); font-size: 11px; display: inline-flex; gap: 3px; align-items: center; }
.chip button { border: 0; background: none; color: var(--muted); padding: 0 3px; }
.chip.add { cursor: pointer; font-family: var(--font-ui); }
.result { font-family: var(--font-mono); font-size: 11.5px; padding: 4px 7px; border-radius: 6px; background: var(--panel-2); }
.result.err { color: var(--danger); }
.rules { display: flex; flex-direction: column; gap: 5px; }
.rule { display: grid; grid-template-columns: 76px 1fr 84px 26px; gap: 4px; }
.rule select, .rule input { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 4px 5px; font-size: 12px; min-width: 0; }
.sep { border: 0; border-top: 1px solid var(--line); margin: 2px 0; }
.helpbox { background: var(--panel-2); border-radius: 8px; padding: 9px 11px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.helpbox b { color: var(--fg); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
details.adv summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); }
details.adv[open] summary { margin-bottom: 8px; }
.page { max-width: 1000px; margin: 0 auto; padding: 16px; }
.page h1 { font-size: 20px; margin: 4px 0; } .page p.lead { color: var(--muted); margin: 0 0 14px; max-width: 72ch; }
.tblwrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); }
.tbl th, .tbl td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; }
.tbl th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; background: var(--panel-2); }
.tbl input, .tbl select { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 5px 7px; width: 100%; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.box h3 { margin: 0; font-size: 14px; }
.colorrow { display: flex; gap: 6px; align-items: center; } .colorrow .swatch { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line); flex: none; }
.mlist { max-height: 55vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; }
.mrow { display: flex; justify-content: space-between; gap: 10px; padding: 5px 9px; border-top: 1px solid var(--line); cursor: pointer; font-size: 12.5px; }
.mrow:first-child { border-top: 0; } .mrow:hover { background: var(--accent-soft); } .mrow small { color: var(--muted); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 45%; }
textarea.bad, input.bad { border-color: var(--danger) !important; }
.bkstate { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; } .bkstate .dot { margin-top: 5px; flex: none; }
.keybox { font: 11.5px ui-monospace, monospace; word-break: break-all; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; user-select: all; }
.vlist { display: flex; flex-direction: column; max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.vlist .v { display: flex; gap: 8px; align-items: center; padding: 6px 9px; border-top: 1px solid var(--line); font-size: 13px; } .vlist .v:first-child { border-top: 0; }
.vlist .v .when { flex: 1; min-width: 0; } .vlist .v .when small { color: var(--muted); display: block; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal .card { background: var(--panel); border-radius: 12px; padding: 18px; width: min(560px, 100%); max-height: 85vh; display: flex; flex-direction: column; gap: 10px; overflow: auto; }
.modal pre { background: var(--panel-2); border-radius: 8px; padding: 12px; overflow: auto; font-family: var(--font-mono); font-size: 12px; margin: 0; max-height: 60vh; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 20px; font-weight: 600; z-index: 60; }
.banner { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px; margin: 40px auto; max-width: 560px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>RackView Builder</b><span>800×480 · RackViewer</span></div>
  <a class="livelink" href="/mirror" target="_blank" title="Open the rack screen live in a new tab: tap it and use its buttons from here"><i></i>Live view</a>
  <nav class="navtabs" role="tablist">
    <button role="tab" data-tab="screens" aria-selected="true">Screens</button>
    <button role="tab" data-tab="alerts" aria-selected="false">Alerts</button>
    <button role="tab" data-tab="notes" aria-selected="false">Notes</button>
    <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
  </nav>
  <span class="spacer"></span>
  <span class="dirty" id="dirty" hidden>Unsaved changes</span>
  <span class="status"><span class="dot" id="hadot"></span><span id="hatext">Connecting…</span></span>
  <button class="btn small" id="maintbtn" title="Maintenance mode: alerts don't wake the screen or pulse. Starts when the rack door opens.">Maintenance</button>
  <button class="btn small" id="undo">Undo</button>
  <button class="btn small" id="redo">Redo</button>
  <button class="btn" id="showjson">JSON</button>
  <button class="btn" id="showdev">Show on device</button>
  <button class="btn primary" id="save">Save</button>
  <a class="btn small" href="/logout">Log out</a>
</header>

<main id="view-screens" class="bench">
  <section class="pane" aria-label="Structure">
    <h2><span class="grow">Screens</span><button class="btn small" id="addscreen">+ Screen</button></h2>
    <div class="scroll"><ul class="tree" id="tree"></ul></div>
    <div class="palette" id="palette"></div>
  </section>
  <section class="pane" aria-label="Preview">
    <h2><span class="grow">Preview · rendered by the display</span><span class="legend" id="pvstate"></span></h2>
    <div class="stage">
      <div class="crumbs" id="crumbs"></div>
      <div class="frame-wrap" id="framewrap"><div class="frame-box" id="framebox"><div class="frame" id="frame"><div class="msg">Loading…</div></div></div></div>
    </div>
  </section>
  <section class="pane" aria-label="Properties">
    <h2><span class="grow">Properties</span></h2>
    <div class="scroll"><div class="insp" id="insp"></div></div>
  </section>
</main>
<main id="view-alerts" class="page" hidden></main>
<main id="view-notes" class="page" hidden></main>
<main id="view-settings" class="page" hidden></main>
<div id="modal-root"></div>

<script>
"use strict";
/* ============================================================ API */
async function api(path, opts) {
  const r = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" }, credentials: "same-origin" }, opts || {}));
  if (r.status === 401) { location.href = "/login"; throw new Error("login"); }
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error((body && body.error) || ("HTTP " + r.status));
  return body;
}
let ENTS = [], ENT = {}, SOURCES = {};

/* ============================================================ widget registry (mirrors engine.py) */
const F = (key, label, type, extra) => Object.assign({ key, label, type }, extra || {});
const COLORS = [["ok", "Green"], ["warn", "Amber"], ["crit", "Red"], ["info", "Blue"], ["dim", "Grey"], ["text", "White"], ["orange", "Orange"], ["teal", "Teal"], ["purple", "Purple"]];
const SIZE = F("grow", "Fill remaining height", "bool");
const GAP = F("gap", "Gap between items (px)", "number", { hint: "Empty = 8" });
const VALTXT = "Text and values: ${$ups.batt|u:%} shows a value from RackView's data, ${@name} a field of the current item, ${sensor.x|d:1} an entity. Filters: d:2 decimals · u: W unit · or:— when missing · map:on=ON;off=OFF;*=? · x:1000 · upper · age · time:%H:%M";
const TYPES = {
  free: { label: "Free layout", ic: "⊞", cat: "Layout", container: true, desc: "Place items at exact x / y positions (px)",
    fields: [F("bg", "Background", "color", { hint: "card = a panel; blank = none" }), F("tint", "Background strength (0–1)", "number"), F("border", "Border colour", "color"), F("radius", "Corner radius (px)", "number"), SIZE] },
  column: { label: "Column", ic: "⬍", cat: "Layout", container: true, desc: "Stack items top to bottom", fields: [GAP, SIZE] },
  row: { label: "Row", ic: "⬌", cat: "Layout", container: true, desc: "Items side by side", fields: [GAP, SIZE] },
  inline: { label: "Inline", ic: "⇥", cat: "Layout", container: true, desc: "Items side by side at their natural width", fields: [GAP] },
  card: { label: "Card", ic: "▢", cat: "Layout", container: true, desc: "Titled panel; can open a detail screen",
    fields: [F("title", "Title", "text"), F("link", "Opens detail screen", "detail", { hint: "Shows “Details ›” on the card. Inside a Repeater, the detail opens for that item." }),
      F("bg", "Tint", "color"), SIZE] },
  tabs: { label: "Tabs", ic: "⧉", cat: "Layout", container: true, accepts: ["tab"], desc: "Switchable tabs",
    fields: [F("tab_w", "Tab width (px)", "number", { hint: "Empty = fit the label" }), F("tab_h", "Tab height (px)", "number"), F("bar_h", "Space for the tab bar (px)", "number"), SIZE] },
  tab: { label: "Tab", ic: "▭", cat: "Layout", container: true, hidden: true, desc: "One tab", fields: [F("title", "Tab label", "text")] },
  repeater: { label: "Repeater", ic: "⟳", cat: "Nesting", container: true, desc: "Same layout for each server, fan, list row…",
    fields: [F("source", "Repeat for each", "source"), F("mode", "Show", "seg", { options: [["one", "One at a time"], ["all", "All"]] }),
      F("header", "Show “name 1/3” next to the screen title", "bool", { showIf: n => n.props.mode !== "all" }),
      F("columns", "Columns", "number", { showIf: n => n.props.mode === "all", hint: "Empty = all in one row" }),
      F("row_h", "Row height (px)", "number", { showIf: n => n.props.mode === "all", hint: "Fixed rows, e.g. a list of temperatures. Empty = rows share the space." }),
      F("max", "At most (items)", "text", { showIf: n => n.props.mode === "all", hint: "A number, or a ref like @temps_max" }),
      F("flow", "Fill order", "seg", { showIf: n => n.props.mode === "all" && n.props.row_h, options: [["row", "Across"], ["col", "Down columns"]] }),
      F("gap_x", "Column gap (px)", "number", { showIf: n => n.props.mode === "all" }), F("gap_y", "Row gap (px)", "number", { showIf: n => n.props.mode === "all" }),
      F("cell_w", "Cell width (px)", "number", { showIf: n => n.props.mode === "all" && n.props.row_h }),
      F("align", "Align cells", "seg", { showIf: n => n.props.cell_w, options: [["left", "Left"], ["right", "Right"]] }),
      F("fit_rows", "Shrink rows to fit", "bool", { showIf: n => n.props.row_h }),
      F("stretch", "Stretch rows to fill", "bool", { showIf: n => n.props.mode === "all" && !n.props.row_h, def: true }), F("empty", "Text when empty", "text"), SIZE] },
  listdetail: { label: "List → Detail", ic: "☰", cat: "Nesting", container: true, accepts: ["slot"], desc: "Pick from a list, see its detail",
    fields: [F("source", "List items from", "source"), F("list_w", "List width (px)", "number"), F("empty", "Text when empty", "text")] },
  slot: { label: "Slot", ic: "▤", cat: "Nesting", container: true, hidden: true, desc: "Part of a List → Detail", fields: [] },
  label: { label: "Label", ic: "A", cat: "Data", desc: "Text and values at a size, colour and alignment",
    fields: [F("text", "Text", "text", { hint: VALTXT, valueText: true }), F("size", "Font size (px)", "number", { def: 15 }), F("bold", "Bold", "bool"), F("color", "Colour", "color"),
      F("align", "Align", "seg", { options: [["left", "Left"], ["center", "Centre"], ["right", "Right"]] }), F("valign", "Vertical", "seg", { options: [["top", "Top"], ["middle", "Middle"], ["bottom", "Bottom"]] }),
      F("wrap", "Wrap onto lines (max)", "number", { hint: "Empty = one line, cut with …" }), F("chip", "Chip behind the text", "color"), F("upper", "UPPERCASE", "bool")] },

  const c = BK.code || {};
  const codeLine = !c.commit ? `<span class="dot bad"></span><span><b>Code version unknown:</b> ${esc(c.note || "")}</span>`
    : c.clean ? `<span class="dot ok"></span><span>Code: <span class="mono">${esc((c.repo || "").replace(/^https:\/\/github.com\//, "").replace(/\.git$/, ""))} @ ${esc(c.short)}</span> · unchanged</span>`
    : `<span class="dot bad"></span><span><b>Code has local changes</b> not in <span class="mono">${esc(c.short)}</span> (${esc((c.changed || []).join(", "))}). They are saved as code.patch in the backup.</span>`;
  el.innerHTML = `
  <div class="box" style="grid-column:1/-1"><div class="bkstate">${codeLine}</div></div>
  <div class="box"><h3>Version history on the Pi</h3><p class="hint" style="margin:0">The last ${BK.keep} saves. Restoring one is itself saved, so you can go back again.</p>
    <div class="vlist">${BK.history.map((v, i) => `<div class="v"><span class="when">${esc(v.reason || "Saved")}${i === 0 ? " <b>(current)</b>" : ""}<small>${esc(when(v.time))} · ${v.screens} screens</small></span>${i ? `<button class="btn small" data-vrestore="${esc(v.id)}">Restore…</button>` : ""}</div>`).join("") || `<div class="v hint">No versions yet.</div>`}</div></div>
  <div class="box"><h3>Backup file</h3><p class="hint" style="margin:0">The full backup is everything to rebuild this display on a fresh Pi: screens, settings, Pi setup and the code version, with <code>restore.sh</code>.</p>
    <div class="btnrow"><a class="btn" href="/api/backup/download" download>Download full backup (.tar.gz)</a><a class="btn" href="/api/backup/download?format=json" download>Screens + settings only (.json)</a><button class="btn" id="bkupload">Restore from file…</button></div>
    <input type="file" id="bkfile" accept=".gz,.tgz,.json,application/gzip,application/json" hidden></div>
  <div class="box"><h3>Git backup (private repository)</h3>
    <div class="bkstate">${gstate}</div><p class="hint" style="margin:0">Pushes the same configuration on every save; its README explains how to rebuild.</p>
    <div class="field"><label for="bkurl">Repository SSH address</label><input type="text" id="bkurl" placeholder="git@github.com:you/rackview-config.git" value="${esc(g.url || "")}" autocomplete="off"></div>
    <div class="btnrow"><button class="btn primary" id="bkseturl">${g.url ? "Update" : "Set up"}</button>${g.url ? `<button class="btn" id="bkpush">Back up now</button><button class="btn" id="bkgitlog">Restore from git…</button><button class="btn danger" id="bkoff">Turn off</button>` : ""}</div>
    ${g.pubkey ? `<details ${g.last_ok ? "" : "open"}><summary class="hint">Deploy key (add once in GitHub)</summary><p class="hint">In GitHub: the repository → Settings → Deploy keys → Add deploy key. Paste this, tick <b>Allow write access</b>, save. Then press “Back up now”.</p><div class="keybox" id="bkkey">${esc(g.pubkey)}</div><button class="btn small" id="bkcopykey" style="margin-top:6px">Copy key</button></details>` : `<p class="hint" style="margin:0">Create an empty <b>private</b> repository first (no README). RackView makes its own key; it can only reach that one repository.</p>`}</div>`;
  clearTimeout(bkTimer); if (g.busy) bkTimer = setTimeout(renderBackup, 2000);
}
function restoreDialog(title, detail, go) {
  modal(`<b>${esc(title)}</b><p class="hint">${detail}</p>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rs-screens" checked> Screens and alert rules</label>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rs-config"> Site settings (restarts RackView)</label>
    ${dirty ? `<p class="hint" style="color:var(--danger)">You have unsaved changes in the builder; they will be lost.</p>` : ""}
    <div class="btnrow" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="rs-go">Restore</button></div>`, m => {
    m.querySelector("#rs-go").onclick = async () => {
      const parts = ["screens", "config"].filter(p => m.querySelector("#rs-" + p).checked);
      if (!parts.length) return toast("Pick what to restore");
      try { const r = await go(parts); closeModal(); setDirty(false); toast(r.restarting ? "Restored · RackView is restarting" : "Restored · the display is updated");
        setTimeout(() => location.reload(), r.restarting ? 6000 : 800); } catch (e) { toast("Couldn't restore: " + e.message); } }; });
}
document.getElementById("view-settings").addEventListener("click", async e => {
  const t = e.target, post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body) });
  if (t.dataset.vrestore) { const v = BK.history.find(x => x.id === t.dataset.vrestore);
    restoreDialog("Restore this version?", `${esc(v.reason || "Saved")} · ${esc(when(v.time))} · ${v.screens} screens`, parts => post("/api/backup/restore", { id: v.id, parts })); }
  if (t.id === "bkupload") document.getElementById("bkfile").click();
  if (t.id === "bkcopykey") navigator.clipboard.writeText(BK.git.pubkey).then(() => toast("Key copied"), () => toast("Select the key and press Ctrl+C"));
  if (t.id === "bkseturl" || t.id === "bkoff") { const url = t.id === "bkoff" ? "" : document.getElementById("bkurl").value.trim();
    if (t.id === "bkseturl" && !url) return toast("Enter the repository address");
    try { await api("/api/backup/git", { method: "PUT", body: JSON.stringify({ url }) }); toast(url ? "Saved · copy the deploy key into GitHub" : "Git backup turned off"); } catch (err) { toast(err.message); }
    renderBackup(); }
  if (t.id === "bkpush") { t.disabled = true; t.textContent = "Backing up…";
    try { await post("/api/backup/push", {}); toast("Backed up to git"); } catch (err) { toast("Backup failed: " + err.message); } renderBackup(); }
  if (t.id === "bkgitlog") { t.disabled = true;
    let log; try { log = await api("/api/backup/git/log"); } catch (err) { t.disabled = false; return toast("Couldn't read git: " + err.message); }
    t.disabled = false;
    modal(`<div style="display:flex;align-items:center"><b style="flex:1">Restore from git</b><button class="btn small" data-close>Close</button></div>
      <div class="vlist">${log.map(c => `<div class="v"><span class="when">${esc(c.msg)}<small>${esc(when(c.time))} · ${esc(c.sha)}</small></span><button class="btn small" data-gsha="${esc(c.sha)}">Restore…</button></div>`).join("") || `<div class="v hint">No backups in the repository yet.</div>`}</div>`, m => {
      m.querySelectorAll("[data-gsha]").forEach(b => b.onclick = () => { const c = log.find(x => x.sha === b.dataset.gsha);
        restoreDialog("Restore this git backup?", `${esc(c.msg)} · ${esc(when(c.time))}`, parts => post("/api/backup/git/restore", { sha: c.sha, parts })); }); }); }
});
document.getElementById("view-settings").addEventListener("change", async e => { if (e.target.id !== "bkfile" || !e.target.files[0]) return;
  const buf = new Uint8Array(await e.target.files[0].arrayBuffer()); e.target.value = "";
  let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  const file = btoa(bin);
  let info; try { info = await api("/api/backup/inspect", { method: "POST", body: JSON.stringify({ file }) }); } catch (err) { return toast(err.message); }
  restoreDialog("Restore from this file?", `Made ${esc(when(info.created))} on ${esc(info.host || "?")} · ${info.screens} screens. App code in the file is not installed here; that is what rebuild.sh is for.`,
    parts => api("/api/backup/upload", { method: "POST", body: JSON.stringify({ file, parts }) }));
});
document.getElementById("view-settings").addEventListener("change", e => { const t = e.target; if (t.dataset.set) settings[t.dataset.set] = t.type === "number" ? +t.value : t.value; });
document.getElementById("view-settings").addEventListener("click", async e => { if (e.target.id !== "savesettings") return;
  try { await api("/api/settings", { method: "PUT", body: JSON.stringify(settings) }); toast("Saved · RackView is restarting"); } catch (err) { toast("Couldn't save: " + err.message); } });

/* ============================================================ top bar, modal, toast */
document.querySelectorAll(".navtabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".navtabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  ["screens", "alerts", "notes", "settings"].forEach(t => document.getElementById("view-" + t).hidden = t !== b.dataset.tab);
  renderAll(); if (b.dataset.tab === "settings") renderSettings(); if (b.dataset.tab === "notes") renderNotes(); if (b.dataset.tab === "alerts") renderDevices(); });
document.getElementById("undo").onclick = () => { if (!hist.length) return; fut.push(JSON.stringify(cfg)); cfg = JSON.parse(hist.pop()); fixSel(); setDirty(true); renderAll(); };
document.getElementById("redo").onclick = () => { if (!fut.length) return; hist.push(JSON.stringify(cfg)); cfg = JSON.parse(fut.pop()); fixSel(); setDirty(true); renderAll(); };
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); document.getElementById(e.shiftKey ? "redo" : "undo").click(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
  if ((e.key === "Delete") && sel.node && !typing) { e.preventDefault(); removeNode(sel.node); }
});
function clean(o) { return JSON.parse(JSON.stringify(o, (k, v) => k.startsWith("_") ? undefined : v)); }
async function save() {
  try { await api("/api/config", { method: "PUT", body: JSON.stringify(clean(cfg)) }); setDirty(false); toast("Saved · the display is updated"); }
  catch (e) { toast("Couldn't save: " + e.message); }
}
document.getElementById("save").onclick = save;
document.getElementById("showdev").onclick = async () => {
  if (dirty) await save();
  try { await api("/api/show", { method: "POST", body: JSON.stringify({ screen: screen().id, detail: sel.detail }) }); toast(`The display is showing “${view().title}”`); } catch (e) { toast(e.message); } };
document.getElementById("showjson").onclick = () => modal(`<div style="display:flex;gap:8px;align-items:center"><b style="flex:1">Screen config (JSON)</b><button class="btn small" id="cpy">Copy</button><button class="btn small" data-close>Close</button></div><pre id="jsonpre">${esc(JSON.stringify(clean(cfg), null, 1))}</pre>`, m => {
  m.querySelector("#cpy").onclick = () => navigator.clipboard.writeText(m.querySelector("#jsonpre").textContent).then(() => toast("Copied"), () => toast("Select the text and press Ctrl+C")); });
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
function modal(html, init) { const m = document.getElementById("modal-root"); m.innerHTML = `<div class="modal" role="dialog"><div class="card">${html}</div></div>`;
  m.querySelectorAll("[data-close]").forEach(b => b.onclick = closeModal); m.querySelector(".modal").onclick = ev => { if (ev.target.classList.contains("modal")) closeModal(); }; if (init) init(m); }
function closeModal() { document.getElementById("modal-root").innerHTML = ""; }
let toastT = null;
function toast(msg) { let t = document.querySelector(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2800); }

function renderAll(preview) {
  fixSel(); syncTabFromSelection();
  if (!document.getElementById("view-screens").hidden) { renderTree(); renderPalette(); renderCrumbs(); renderInspector();
    if (preview === false) frame.querySelectorAll("[data-hot]").forEach(h => h.classList.toggle("sel", h.dataset.hot === sel.node)); else schedulePreview(); }
  if (!document.getElementById("view-alerts").hidden) renderAlerts();
  document.getElementById("undo").disabled = !hist.length; document.getElementById("redo").disabled = !fut.length;
}
let OPST = null;
async function pollOps() { try { OPST = await api("/api/ops"); } catch (e) { return; }
  const b = document.getElementById("maintbtn"), m = OPST.maint || {};
  b.classList.toggle("on", !!m.active); b.textContent = m.active ? `Maintenance · ${Math.round(m.minutes)} min${m.source === "door" ? " (door)" : ""}` : "Maintenance";
  if (OPST.outage && OPST.outage.active) document.getElementById("hatext").textContent = "⚡ POWER OUTAGE · on battery"; }
document.getElementById("maintbtn").onclick = async () => {
  const on = !(OPS && OPST.maint && OPST.maint.active);
  try { await api("/api/maintenance", { method: "POST", body: JSON.stringify({ on }) }); toast(on ? "Maintenance started: alerts won't wake the screen" : "Maintenance ended"); }
  catch (e) { toast(e.message); } setTimeout(pollOps, 1500); };
async function pollStatus() { pollOps(); try { const s = await api("/api/status"); document.getElementById("hadot").className = "dot " + (s.ha_ok ? "ok" : "bad");
  document.getElementById("hatext").textContent = s.ha_ok ? `Display on “${(cfg.screens.find(x => x.id === s.page) || {}).title || s.page}”` : "Home Assistant not answering"; } catch (e) {} }

(async function boot() {
  try {
    [cfg, ENTS, SOURCES] = await Promise.all([api("/api/config"), api("/api/entities"), api("/api/sources")]);
  } catch (e) { if (e.message !== "login") document.getElementById("view-screens").innerHTML = `<div class="banner"><b>Can't reach RackView.</b><p>${esc(e.message)}</p></div>`; return; }
  ENTS.forEach(e => ENT[e.id] = e);
  loadModel(); api("/api/history/metrics").then(x => METRICS = x).catch(() => {});
  document.body.insertAdjacentHTML("beforeend", `<datalist id="colorwords">${COLOR_WORDS.map(c => `<option value="${c}">`).join("")}</datalist>`);
  cfg.screens.forEach(s => { s.details = s.details || []; });
  sel.screen = cfg.screens[0].id;
  fit(); renderAll(); pollStatus(); setInterval(pollStatus, 10000);
  if (location.hash === "#selftest") selftest();
  if (location.hash === "#settings" || location.hash === "#backup") document.querySelector(".navtabs [data-tab=settings]").click();
})();

/* ============================================================ self-test (run by opening /#selftest) */
async function selftest() {
  const log = (...a) => console.log("SELFTEST", ...a);
  try {
    log("screens", cfg.screens.map(s => s.id).join(","));
    sel = { screen: "t-cooling", detail: null, node: null }; renderAll(); await new Promise(r => setTimeout(r, 1500));
    log("preview rects", rects.length, "img", !!frame.querySelector("img"));
    const card = findNode("c2", screen().root); sel.node = "c2"; renderAll(false);
    log("inspector has detail field", !!insp.querySelector("select[data-k=link]"));
    addNode("pill"); const added = cur(); log("added", added && added.type, "under", labelOf(findParent(added.id, view().root)));
    const inp = insp.querySelector("input[data-ref=entity]"); inp.value = "sensor.syncserver_s250_status"; inp.dispatchEvent(new Event("input", { bubbles: true }));
    await new Promise(r => setTimeout(r, 900)); log("ref result", (insp.querySelector(".result") || {}).textContent);
    moveNode(added.id, "c3", "before"); log("moved before c3:", findParent(added.id, view().root).children.map(c => c.type).join(","));
    document.getElementById("undo").click(); document.getElementById("undo").click(); log("after undo x2 has pill:", !!findNode(added.id, screen().root));
    sel.detail = "fan-detail"; sel.node = null; renderAll(); await new Promise(r => setTimeout(r, 1500)); log("detail preview rects", rects.length);
    const t = await api("/api/template", { method: "POST", body: JSON.stringify({ template: "{{ 1 + 1 }}" }) }); log("template", t.result);
    const shown = () => ["screens", "alerts", "notes", "settings"].filter(v => getComputedStyle(document.getElementById("view-" + v)).display !== "none").join(",");
    for (const tab of ["alerts", "settings", "screens"]) {
      document.querySelector(`.navtabs [data-tab=${tab}]`).click(); await new Promise(r => setTimeout(r, 400));
      log(`tab ${tab}: visible views = ${shown()}`, shown() === tab ? "OK" : "WRONG");
    }
    const ov = cfg.screens.find(x => x.root && x.root.type === "free");
    if (ov) { sel = { screen: ov.id, detail: null, node: null }; renderAll(); await new Promise(r => setTimeout(r, 1500));
      const lab = (() => { let h = null; walkN(ov.root, x => { if (!h && x.type === "label") h = x; }); return h; })();
      sel.node = lab.id; renderAll(false);
      log("free layout: label has x field", !!insp.querySelector("input[data-k=x]"), "colour field", !!insp.querySelector("input[list=colorwords]"), "insert-value chip", !!insp.querySelector("[data-modelins]"));
      await loadModel(); log("model paths", MODEL.length, "has $ups.batt", MODEL.some(m => m.path === "ups.batt"));
      const t = await api("/api/text", { method: "POST", body: JSON.stringify({ text: "UPS ${$ups.batt|u:%}" }) }); log("text api", t.text); }
    const ops = await api("/api/ops"); log("ops: maint", JSON.stringify(ops.maint), "devices", ops.devices_count, ops.devices_scope, "notes", ops.notes.length);
    const nn = await api("/api/notes", { method: "POST", body: JSON.stringify({ text: "selftest note" }) });
    document.querySelector(`.navtabs [data-tab=notes]`).click(); await new Promise(r => setTimeout(r, 800));
    log("notes tab shows note", document.getElementById("view-notes").textContent.includes("selftest note"), "visible", getComputedStyle(document.getElementById("view-notes")).display !== "none");
    await api("/api/notes/" + nn.id, { method: "DELETE" });
    const mets = await api("/api/history/metrics"); log("history metrics", mets.length);
    document.querySelector(`.navtabs [data-tab=settings]`).click(); await new Promise(r => setTimeout(r, 1500));
    log("backup versions", BK && BK.history.length, "download links", document.querySelectorAll("a[href^='/api/backup/download']").length);
    document.querySelector(`.navtabs [data-tab=screens]`).click();
    log("DONE ok");
  } catch (e) { log("FAILED", e.message, e.stack); }
}
</script>
